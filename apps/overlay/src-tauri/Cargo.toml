[package]
name = "gamepoint-overlay"
version = "0.1.0"
description = "GamePoint Picture-in-Picture Desktop Overlay Host"
edition = "2021"
license = "LicenseRef-Proprietary-APEX"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
